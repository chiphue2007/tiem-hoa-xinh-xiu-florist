<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý đơn | Tiệm Hoa Xinh Xíu</title><style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#fbf7f3;color:#334238;margin:0}header{background:#fff;border-bottom:1px solid #eee;padding:20px max(20px,calc((100vw - 1050px)/2))}h1{margin:0;font-size:25px}main{max-width:1050px;margin:35px auto;padding:0 18px}.panel,.order{background:#fff;border:1px solid #ece5e2;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 6px 22px #00000008}input,select,button{font:inherit;padding:11px;border:1px solid #ddd;border-radius:9px}button{background:#49674e;color:#fff;border:0;cursor:pointer}button:disabled{opacity:.6}.login{display:flex;gap:10px;flex-wrap:wrap}.login input{flex:1;min-width:180px}.row{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.muted{color:#79857a;font-size:13px}details{margin-top:12px}select{max-width:100%;background:#fff}.error{color:#b44343}a{color:#49674e}.orders{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:14px}.order{margin:0}.order p{line-height:1.6}</style></head><body><header><div class="row"><h1>🌷 Quản lý đơn hàng · Xinh Xíu</h1><a href="/">← Về cửa hàng</a></div></header><main><section class="panel"><h2>Đăng nhập quản trị</h2><p class="muted">Nhập mật khẩu ADMIN_PASSWORD đã thiết lập trong Netlify. Mật khẩu chỉ được dùng trong phiên trang này.</p><div class="login"><input type="password" id="password" placeholder="Mật khẩu quản trị" autocomplete="off"><button id="load">Xem đơn hàng</button><button id="refresh">Làm mới</button></div><p id="notice" role="status"></p></section><section class="row"><h2>Đơn hàng <span id="count"></span></h2><select id="filter"><option>Tất cả</option><option>Chờ xác nhận</option><option>Đã xác nhận</option><option>Đang chuẩn bị</option><option>Đã giao</option><option>Đã hủy</option></select></section><div id="orders" class="orders"></div></main><script>let orders=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n).toLocaleString('vi-VN')+'đ';const statuses=['Chờ xác nhận','Đã xác nhận','Đang chuẩn bị','Đã giao','Đã hủy'];const notice=(s,error=false)=>{const el=document.getElementById('notice');el.textContent=s;el.className=error?'error':'muted'};async function request(method,body){const r=await fetch('/.netlify/functions/orders',{method,headers:{'x-admin-password':document.getElementById('password').value,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'Không thể tải dữ liệu');return j}async function load(){try{notice('Đang tải đơn hàng...');orders=(await request('GET')).orders;render();notice('Đã cập nhật '+orders.length+' đơn hàng')}catch(e){notice(e.message,true)}}function render(){const f=document.getElementById('filter').value;const list=orders.filter(o=>f==='Tất cả'||o.status===f);document.getElementById('count').textContent='('+list.length+')';document.getElementById('orders').innerHTML=list.map(o=>`<article class="order"><div class="row"><strong>${esc(o.id)}</strong><span class="muted">${new Date(o.createdAt).toLocaleString('vi-VN')}</span></div><h3>${esc(o.customer)}</h3><p>📞 ${esc(o.phone)}<br>💐 ${o.items.map(x=>esc(x.name)+' × '+x.qty).join(', ')}<br><strong>${money(o.total)}</strong> · Chưa phí giao</p><label>Trạng thái: <select data-id="${esc(o.id)}" class="status">${statuses.map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></label><details><summary>Xem chi tiết đơn</summary><p>Hình thức: ${esc(o.delivery)}<br>Địa chỉ: ${esc(o.address||'Nhận tại tiệm')}<br>Ngày nhận: ${esc(o.date||'Chưa chọn')}<br>Lời thiệp: ${esc(o.message||'Không có')}<br>Ghi chú: ${esc(o.notes||'Không có')}</p></details></article>`).join('')||'<p>Chưa có đơn hàng trong mục này.</p>';document.querySelectorAll('.status').forEach(el=>el.onchange=async()=>{const prev=orders.find(x=>x.id===el.dataset.id).status;el.disabled=true;try{await request('PATCH',{id:el.dataset.id,status:el.value});orders.find(x=>x.id===el.dataset.id).status=el.value;notice('Đã cập nhật trạng thái')}catch(e){el.value=prev;notice(e.message,true)}finally{el.disabled=false}})}document.getElementById('load').onclick=load;document.getElementById('refresh').onclick=load;document.getElementById('filter').onchange=render;document.getElementById('password').onkeydown=e=>{if(e.key==='Enter')load()};</script></body></html>
